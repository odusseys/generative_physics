[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wan-lpips"
version = "0.1.0"
description = "Wan2.2 latent perceptual-metric training and video augmentations"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
]

[project.optional-dependencies]
video = [
    "av",
    "ipython",
    "pillow",
]
training = [
    "matplotlib",
    "safetensors",
    "torchvision",
    "tqdm",
]

[tool.setuptools]
packages = ["wan_lpips"]
